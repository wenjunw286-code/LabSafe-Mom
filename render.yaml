services:
  - type: web
    name: labsafe-mom-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./labsafe.db
      - key: DATABASE_URL_SYNC
        value: sqlite:///./labsafe.db
      - key: CORS_ORIGINS
        value: '["https://lab-safe-mom.vercel.app","https://lab-safe-mom-wenjunw286-codes-projects.vercel.app","https://lab-safe-mom-git-main-wenjunw286-codes-projects.vercel.app","http://localhost:3000","http://localhost:3010"]'
      - key: AI_MODEL
        value: deepseek-v4-pro
