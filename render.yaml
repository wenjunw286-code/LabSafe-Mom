services:
  - type: web
    name: labsafe-mom-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./labsafe.db
      - key: DATABASE_URL_SYNC
        value: sqlite:///./labsafe.db
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
      - key: AI_MODEL
        value: deepseek-v4-pro
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
