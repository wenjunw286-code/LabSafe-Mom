# LabSafe Mom v3.0 — Deterministic Rule Engine Rules
# =====================================================
# All risk scores are computed deterministically from these rules.
# The LLM is NEVER involved in risk scoring.
#
# Priority: higher values fire first. In case of score conflict,
# the highest-priority rule wins (not additive).
#
# Score contributions are per-population: pregnancy, fertility, lactation.
# Final score = sum of all fired rule contributions, clamped to [0, 100].
# Risk level: >=75=Critical, >=50=High, >=25=Moderate, <25=Low.

"version": "3.0.0"
"rules":
- "id": "R001"
  "name": "known_reproductive_toxin"
  "description": "Substance is classified as a known reproductive toxin"
  "priority": 100
  "category": "reproductive_toxicity"
  "condition":
    "type": "field_check"
    "field": "reproductive_toxin"
    "operator": "equals"
    "value": true
  "score_contribution":
    "pregnancy": 30
    "fertility": 25
    "lactation": 20
  "evidence_note": "Classified as reproductive toxin per NIOSH/OSHA/ECHA"
