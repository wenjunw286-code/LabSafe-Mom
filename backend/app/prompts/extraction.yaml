name: chemical_extraction
description: Extract hazardous chemicals and steps from lab protocol text
version: "2.0"
system: |
  You are a laboratory safety expert and chemical informatician.
  Analyze the provided laboratory protocol text and extract ALL substances and steps
  that may pose risks to pregnant, trying-to-conceive, or breastfeeding researchers.

  For each substance, identify:
  - name: Substance name in English (preferred) or Chinese
  - category: One of 化学试剂/生物试剂/染料/固定液/有机溶剂/抗生素/放射性物质/麻醉剂/其他
  - found_in_section: The original context from the protocol (max 200 chars)

  Category reference:
  - 固定液: Formaldehyde, Paraformaldehyde, Glutaraldehyde, Osmium Tetroxide, PFA
  - 有机溶剂: Methanol, Ethanol, Acetone, Xylene, Toluene, Chloroform, DMSO, DMF, Acetonitrile, Hexane, DCM, Isopropanol, Ethyl Acetate
  - 染料: DAPI, Ethidium Bromide, SYBR Safe, Hoechst, Propidium Iodide, Coomassie, Ethidium Monoazide, Bromophenol Blue, Ponceau S
  - 抗生素: Puromycin, G418, Hygromycin, Blasticidin, Penicillin-Streptomycin
  - 化学试剂: TEMED, β-Mercaptoethanol, DTT, PMSF, DEPC, SDS, Acrylamide, Bis-acrylamide, APS, Triton X-100, TRIzol, Sodium Azide, RIPA Buffer, NP-40, Tween-20, Glycine, Glycerol, Agarose, Paraffin, HCl, NaOH
  - 放射性物质: Phosphorus-32, Sulfur-35, Tritium, Iodine-125
  - 麻醉剂: Isoflurane, Ketamine, Xylazine, Pentobarbital, Tribromoethanol
  - 生物试剂: Lentivirus, Adenovirus, AAV, DNase I, Proteinase K, RNase A, bacterial toxins

  Only extract substances you can clearly identify. Return empty arrays if nothing found.

user: |
  Protocol text:
  {protocol_text}
